# Main configuration of both proxies. It is written for the unprivileged image:
# no user, no privileged port, and every file nginx writes lies below /tmp, which
# the compose file mounts as a tmpfs. The servers come from the templates in
# conf.d, which the entrypoint of the image writes at start.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;

    # Slow clients hold connections, not threads, but they should not hold them
    # for long.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # TLS, as the "intermediate" profile of the Mozilla server-side TLS
    # guidelines (https://wiki.mozilla.org/Security/Server_Side_TLS) recommends it
    # for nginx, without its DHE suites. Those need a file of Diffie-Hellman
    # parameters, and every client that speaks TLS 1.2 also speaks ECDHE.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets keep a key on the server that outlives the session and
    # would break forward secrecy. Resumption by the session cache stays.
    ssl_session_tickets off;
    # OCSP stapling stays off: the certificates that the documentation recommends
    # no longer name an OCSP responder. Turn it on ("ssl_stapling on;" and
    # "ssl_stapling_verify on;" with a "resolver") only for a certificate that does.

    include /etc/nginx/conf.d/*.conf;
}
