- id: "7d2a51c4-3b8e-4f0a-9c6d-1e2f3a4b5c6d"
  service: "mcp"
  # Address and port to listen on. Ports below 1024 need CAP_NET_BIND_SERVICE.
  listen: ":8080"
  # What the server calls itself and what it offers. Fill in every empty value:
  # the sensor does not start before, because values that every installation
  # shares would identify the honeypot. The description of a tool is what an AI
  # agent reads to decide whether to call it, and the response is plain text.
  mcp:
    path: ""
    server_name: ""
    server_version: ""
    tools:
      - name: ""
        description: ""
        response: ""
  secret: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
