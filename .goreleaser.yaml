# SPDX-FileCopyrightText: The Nyktus Authors
# SPDX-License-Identifier: AGPL-3.0-or-later

# Release of the server and the sensor, built for the tag "vX.Y.Z". Both have
# the version of the tag, so a release is one run: the same checksums and the
# same signature cover the archives of both, and each has an archive, an image
# and an SBOM of its own. Run it through the targets of the Makefile, which pin
# the tools: "make release-snapshot" builds everything locally without
# publishing.
#
# The server reads its version from the toolchain, which stamps the tag of the
# checkout into the binary. The sensor is a module in a subdirectory, for which
# the toolchain stamps no tag, so its version is linked in.

version: 2
project_name: nyktus

before:
  hooks:
    # The console is embedded into the binary, so it is built first.
    - make web-build

builds:
  - id: nyktus
    main: ./cmd/nyktus
    binary: nyktus
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # GoReleaser would add "-s -w" and flags that set a version in main, which
    # the binary does not have. Stripping the symbols would also leave
    # govulncheck unable to analyse the binary.
    ldflags:
      - -buildid=
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: nyktus-sensor
    dir: sensor
    main: ./cmd/nyktus-sensor
    binary: nyktus-sensor
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -buildid=
      - -X nyktus.org/nyktus/sensor/internal/version.linked={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: nyktus
    ids: [nyktus]
    formats: [tar.gz]
    name_template: "nyktus_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md
      - README.md

  - id: nyktus-sensor
    ids: [nyktus-sensor]
    formats: [tar.gz]
    name_template: "nyktus-sensor_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - src: sensor/THIRD-PARTY-NOTICES.md
        dst: THIRD-PARTY-NOTICES.md
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The SBOM of each archive lists the Go modules that went into the binary.
sboms:
  - artifacts: archive
    documents: ["${artifact}.sbom.spdx.json"]
    cmd: go
    args:
      - run
      - github.com/anchore/syft/cmd/syft@{{ .Env.SYFT_VERSION }}
      - scan
      - "file:${artifact}"
      - --output
      - spdx-json=${document}

# Keyless signature of the checksums with the identity of the workflow. The
# bundle holds the signature, the certificate and the entry in the transparency
# log, so that "cosign verify-blob" needs nothing else.
signs:
  - cmd: go
    args:
      - run
      - github.com/sigstore/cosign/v3/cmd/cosign@{{ .Env.COSIGN_VERSION }}
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    signature: ${artifact}.sigstore.json
    output: true

dockers_v2:
  - id: nyktus
    ids: [nyktus]
    dockerfile: deploy/release/Dockerfile
    images:
      - ghcr.io/nyktus/nyktus
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD-PARTY-NOTICES.md
    labels:
      org.opencontainers.image.title: Nyktus
      org.opencontainers.image.description: Self-hosted deception platform
      org.opencontainers.image.url: https://docs.nyktus.org
      org.opencontainers.image.source: https://github.com/Nyktus/nyktus
      org.opencontainers.image.licenses: AGPL-3.0-or-later
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    # The SBOM of the image is made and signed by the entry "sbom" of docker_signs
    # below, so that the tool is pinned like the others.
    sbom: false

  - id: nyktus-sensor
    ids: [nyktus-sensor]
    dockerfile: deploy/release/Dockerfile.sensor
    images:
      - ghcr.io/nyktus/nyktus-sensor
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    extra_files:
      - LICENSE
      - NOTICE
      - sensor/THIRD-PARTY-NOTICES.md
    labels:
      org.opencontainers.image.title: Nyktus sensor
      org.opencontainers.image.description: Honeypot sensor of Nyktus for monitored networks
      org.opencontainers.image.url: https://docs.nyktus.org
      org.opencontainers.image.source: https://github.com/Nyktus/nyktus
      org.opencontainers.image.licenses: AGPL-3.0-or-later
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: false

# The signature covers the digest of the image index, so every tag of it is
# verified by one signature. Both images are manifests, so both entries below
# run once for each.
docker_signs:
  - cmd: go
    args:
      - run
      - github.com/sigstore/cosign/v3/cmd/cosign@{{ .Env.COSIGN_VERSION }}
      - sign
      - --yes
      - ${artifact}@${digest}
    artifacts: manifests
    output: true

  # A signed SBOM of every platform of the image, with the packages of the base
  # image as well as the Go modules. The script reads the image from the registry,
  # so it runs after the push.
  - id: sbom
    cmd: deploy/release/attest-sbom.sh
    args:
      - ${artifact}@${digest}
    artifacts: manifests
    output: true

# The notes of a release are written by the release pull request. GoReleaser
# only attaches the files to the release that exists, and creates one if there
# is none.
changelog:
  disable: true

release:
  mode: keep-existing
  # A version with a suffix, such as 0.1.0-rc.1, is marked as a pre-release.
  prerelease: auto
  github:
    owner: Nyktus
    name: nyktus
