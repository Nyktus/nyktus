version: "2"

linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - gosec
    - intrange
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - perfsprint
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - thelper
    - unconvert
    - unparam
    - usestdlibvars

  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: math/rand$
              desc: use crypto/rand for anything security-relevant, math/rand/v2 otherwise
            - pkg: log$
              desc: use log/slog through the logging package
        # The internet-facing trigger resolves one trigger value at a time
        # through a database function. It never imports the inventory, so that
        # a compromised trigger host cannot list the decoys, and never the
        # alerting, so that it holds no channel or credential of an alert.
        trigger:
          list-mode: lax
          files:
            - "**/internal/trigger/**"
          deny:
            - pkg: nyktus.org/nyktus/internal/honeytoken
              desc: the trigger never reads the inventory; it resolves single trigger values through a database function
            - pkg: nyktus.org/nyktus/internal/scenario
              desc: the trigger never reads the inventory; it resolves single trigger values through a database function
            - pkg: nyktus.org/nyktus/internal/honeypot
              desc: the trigger never reads the inventory; it resolves single trigger values through a database function
            - pkg: nyktus.org/nyktus/internal/alerting
              desc: the trigger records events and their jobs; the worker processes them and sends alerts
            - pkg: nyktus.org/nyktus/internal/incident
              desc: the trigger records events and their jobs; the worker correlates them into incidents
            - pkg: nyktus.org/nyktus/internal/worker
              desc: the trigger records events and their jobs; the worker processes them
        # The internet-facing DNS role follows the rules of the trigger: it
        # resolves one trigger value at a time through a database function,
        # never imports the inventory, the alerting or the console, and holds
        # no code of the HTTP trigger.
        dns:
          list-mode: lax
          files:
            - "**/internal/dns/**"
          deny:
            - pkg: nyktus.org/nyktus/internal/honeytoken
              desc: the DNS role never reads the inventory; it resolves single trigger values through a database function
            - pkg: nyktus.org/nyktus/internal/scenario
              desc: the DNS role never reads the inventory; it resolves single trigger values through a database function
            - pkg: nyktus.org/nyktus/internal/honeypot
              desc: the DNS role never reads the inventory; it resolves single trigger values through a database function
            - pkg: nyktus.org/nyktus/internal/alerting
              desc: the DNS role records events and their jobs; the worker processes them and sends alerts
            - pkg: nyktus.org/nyktus/internal/console
              desc: the DNS role is reached from the internet and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/auth
              desc: the DNS role is reached from the internet and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/user
              desc: the DNS role is reached from the internet and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/audit
              desc: the DNS role is reached from the internet and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/trigger
              desc: the DNS role and the trigger are separate roles that share nothing but the database
            - pkg: nyktus.org/nyktus/internal/incident
              desc: the DNS role records events and their jobs; the worker correlates them into incidents
            - pkg: nyktus.org/nyktus/internal/worker
              desc: the DNS role records events and their jobs; the worker processes them
        # The worker connects only outwards and holds no code that answers
        # requests: no handlers of the console, no sign-in, no trigger. Its
        # domain packages stay free of HTTP, so that the worker can run on a
        # host that the console does not share.
        worker:
          list-mode: lax
          files:
            - "**/internal/worker/**"
            - "**/internal/incident/*.go"
          deny:
            - pkg: nyktus.org/nyktus/internal/console
              desc: the worker answers no requests and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/auth
              desc: the worker answers no requests and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/platform/httpx
              desc: the worker answers no requests; handlers live in API packages of their own
            - pkg: nyktus.org/nyktus/internal/honeytoken/honeytokenapi
              desc: the worker answers no requests and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/honeypot/honeypotapi
              desc: the worker answers no requests and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/audit/auditapi
              desc: the worker answers no requests and holds no code of the console
            - pkg: nyktus.org/nyktus/internal/trigger
              desc: the worker and the trigger are separate roles that share nothing but the database
            - pkg: nyktus.org/nyktus/internal/dns
              desc: the worker and the DNS role are separate roles that share nothing but the database
        # The domain of the alerting runs in the worker as well, which delivers
        # the alerts: it holds no code of the console, reads no inventory and
        # stays free of HTTP handlers. Its handlers live in alertingapi.
        alerting:
          list-mode: lax
          files:
            - "**/internal/alerting/*.go"
          deny:
            - pkg: nyktus.org/nyktus/internal/console
              desc: the alerting runs in the worker, which holds no code of the console
            - pkg: nyktus.org/nyktus/internal/auth
              desc: the alerting runs in the worker, which holds no code of the console
            - pkg: nyktus.org/nyktus/internal/platform/httpx
              desc: the alerting runs in the worker, which answers no requests; handlers live in alertingapi
            - pkg: nyktus.org/nyktus/internal/honeytoken
              desc: alerts carry no inventory; the incident holds what an alert reports
            - pkg: nyktus.org/nyktus/internal/scenario
              desc: alerts carry no inventory; the incident holds what an alert reports
            - pkg: nyktus.org/nyktus/internal/honeypot
              desc: alerts carry no inventory; the incident holds what an alert reports
        # The sensor runs in the monitored network and talks to attackers. It is
        # a module of its own and imports nothing of the server: without a
        # require, the compiler refuses it already, and this rule keeps a
        # change from adding one.
        sensor:
          list-mode: lax
          files:
            - "**/sensor/**"
          deny:
            - pkg: nyktus.org/nyktus/internal
              desc: the sensor is a module of its own and imports nothing of the server
            - pkg: nyktus.org/nyktus/cmd
              desc: the sensor is a module of its own and imports nothing of the server
            - pkg: nyktus.org/nyktus/catalog
              desc: the sensor is a module of its own and imports nothing of the server
            - pkg: nyktus.org/nyktus/migrations
              desc: the sensor is a module of its own and imports nothing of the server
            - pkg: nyktus.org/nyktus/api
              desc: the sensor is a module of its own and imports nothing of the server
        # The clock of tests moves by hand and is for tests only.
        sensor-test-only:
          list-mode: lax
          files:
            - "**/sensor/**"
            - "!$test"
            - "!**/sensor/internal/clock/clocktest/*.go"
          deny:
            - pkg: nyktus.org/nyktus/sensor/internal/clock/clocktest
              desc: the clock of tests is for tests only
        # Test-only dependencies must never reach the binaries.
        test-only:
          list-mode: lax
          files:
            - "!$test"
            - "!**/sensor/**"
            - "!**/internal/platform/apispec/*.go"
            - "!**/internal/platform/schematest/*.go"
            - "!**/internal/platform/secretbox/secretboxtest/*.go"
            - "!**/internal/platform/smtp/smtptest/*.go"
          deny:
            - pkg: go.yaml.in/yaml
              desc: the YAML parser is a test dependency
            - pkg: nyktus.org/nyktus/internal/platform/apispec
              desc: the specification checks are used by tests only
            - pkg: nyktus.org/nyktus/internal/platform/dbtest
              desc: test databases are for tests only
            - pkg: nyktus.org/nyktus/internal/platform/schematest
              desc: test databases are for tests only
            - pkg: nyktus.org/nyktus/internal/platform/secretbox/secretboxtest
              desc: test keys are for tests only
            - pkg: nyktus.org/nyktus/internal/platform/smtp/smtptest
              desc: the SMTP server is for tests only
        # Mail goes through one client, which verifies the server, bounds the
        # conversation and checks every header.
        smtp:
          list-mode: lax
          files:
            - "!**/internal/platform/smtp/*.go"
          deny:
            - pkg: net/smtp
              desc: send mail through internal/platform/smtp

    exhaustive:
      default-signifies-exhaustive: true

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^(fmt\.Print.*|print|println)$
          msg: write to an explicit io.Writer or use the logger
        - pattern: ^os\.(Getenv|LookupEnv|Environ)$
          msg: read configuration through the config package
        - pattern: ^password\.NewHasherWithCost$
          msg: weaker password hashing is for tests only, through passwordtest

    godot:
      scope: declarations

    misspell:
      locale: US
      # MITRE is the organization behind ATT&CK, not a misspelling of miter.
      ignore-rules:
        - mitre

    nolintlint:
      require-explanation: true
      require-specific: true

    sloglint:
      no-global: all
      context: scope
      static-msg: true
      msg-style: lowercased
      key-naming-case: snake

  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
        text: G101
      - path: internal/platform/(config|dbtest)/
        linters: [forbidigo]
        text: os\.(Getenv|LookupEnv|Environ)
      - path: internal/auth/password/
        linters: [forbidigo]
        text: NewHasherWithCost

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - nyktus.org/nyktus
