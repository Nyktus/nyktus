# SPDX-License-Identifier: AGPL-3.0-or-later

# This specification is the contract of the console HTTP interface. It is written
# by hand and kept in sync with the router by a test: every operation must exist in
# the router with the same method, path and access requirement, and vice versa.
#
# Every operation declares who may call it in x-access:
#   public         no authentication
#   authenticated  any signed-in user or API key, regardless of permissions
#   resource:action
#                  a principal that holds this permission

openapi: 3.1.0

info:
  title: Nyktus API
  summary: Console API of the Nyktus deception platform.
  description: |
    API routes live under `/api/v1`. Health endpoints for orchestrators live at the
    root.

    Every GET operation also answers HEAD with the same access requirement and
    without a body.

    Every error response uses the same envelope. Server errors carry a generic
    message and a request ID that correlates them with the server log.

    Browsers authenticate with a session cookie, which `POST /api/v1/session`
    sets. Requests that change state and carry an `Origin` header must come from
    the origin of the console, otherwise they receive `403`.
  version: 0.0.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /

tags:
  - name: health
    description: Liveness and readiness probes for orchestrators.
  - name: setup
    description: Creation of the first administrator of an installation.
  - name: session
    description: Sign-in, the session of the caller and sign-out.
  - name: audit
    description: The audit log of security-relevant actions.

paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Report that the process is running
      description: Checks no dependencies, so that an orchestrator does not restart the process while the database is down.
      tags: [health]
      x-access: public
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the console can serve requests
      tags: [health]
      x-access: public
      responses:
        "200":
          description: The console is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/setup:
    post:
      operationId: createFirstAdministrator
      summary: Create the first administrator
      description: |
        Creates the first administrator, active and with the given password. The
        request must carry a setup token. While no administrator exists, every
        console process issues one when it starts and prints a setup URL that
        contains the token in its fragment, such as
        `https://nyktus.example.com/setup#token=...`. A token is valid for one
        hour and can be used once.

        Once an administrator exists, the setup is closed for good, also after a
        restart. From then on, and for every request whose token is unknown,
        expired or already used, the operation answers with the same status,
        headers and body as a route that does not exist. Fields are validated only for a valid token.
      tags: [setup]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The administrator has been created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/session:
    post:
      operationId: signIn
      summary: Sign in with email address and password
      description: |
        Starts a session and sets the session cookie. A session cookie that the
        request already carries ends its session.

        Every rejected sign-in receives the same `401`, whether the address is
        unknown, the password is wrong or the account may not sign in. Five failed
        sign-ins in a row lock the account for 15 minutes. Only a request with the
        correct password learns that the account is locked, through `403` with the
        code `account_locked`.
      tags: [session]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. The response sets the session cookie.
          headers:
            Set-Cookie:
              description: The session cookie `__Host-nyktus_session`, with `Secure`, `HttpOnly`, `SameSite=Strict` and `Path=/`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The email address or the password is wrong, or the account may not sign in.
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The password is correct, but the account is locked (`account_locked`), or the request comes from another origin.
          headers:
            Retry-After:
              description: Seconds until the lock ends. Only sent for a locked account.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: getSession
      summary: Return the session of the caller
      description: Returns the signed-in user and when the session ends. A request extends the session up to its maximum age.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session of the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: signOut
      summary: Sign out
      description: Ends the session of the caller and clears the session cookie.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/audit-entries:
    get:
      operationId: listAuditEntries
      summary: List audit entries
      description: |
        Returns audit entries from the newest to the oldest, a page at a time. To
        read the next page, pass the `next_cursor` of a response as `cursor`.
        Entries recorded meanwhile do not shift the following pages.

        Entries are ordered by the time they were written, not by the time their
        transaction committed. An entry of a transaction that took long to
        commit can appear behind entries a reader has already passed. A client
        that polls for new entries should therefore read again from a few minutes
        before its newest entry. Entries with the same time are ordered by their
        identifier, which makes the order total, not chronological.
      tags: [audit]
      x-access: audit:read
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          description: Number of entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nyktus_session
      description: Session token set by `POST /api/v1/session`.

  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, email, display_name, password]
      properties:
        token:
          type: string
          description: The setup token from the fragment of the setup URL.
        email:
          type: string
          format: email
          maxLength: 254
          description: Sign-in address. It is stored in lower case.
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name shown in the console and the audit log. Printable characters without leading or trailing spaces.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFC normalization.

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: Sign-in address, in any case.
        password:
          type: string
          format: password

    Session:
      type: object
      additionalProperties: false
      required: [user, idle_expires_at, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends unless it is used before.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest.

    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, role, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [admin, editor, viewer]
        status:
          type: string
          enum: [pending, active, deactivated]
          description: A pending account has not set a password yet. A deactivated account cannot sign in.

    AuditEntryPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Cursor of the next page. Absent on the last page.

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, action, outcome, actor, changed_fields]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
          description: What was done, in the form `resource.verb`, such as `session.create`. A denied request names the permission it lacked, such as `audit.read`.
          examples: [session.create]
        outcome:
          type: string
          enum: [success, failure, denied]
        actor:
          $ref: "#/components/schemas/AuditActor"
        resource:
          $ref: "#/components/schemas/AuditResource"
        changed_fields:
          type: array
          description: Names of the fields that an update changed, never their values.
          items:
            type: string
        client_ip:
          type: string
          description: Address of the client, if the action came from one.
        request_id:
          type: string
          description: Links the entry to the log records of its request.

    AuditActor:
      type: object
      additionalProperties: false
      required: [kind, auth_method]
      properties:
        kind:
          type: string
          enum: [user, setup, system, anonymous]
        auth_method:
          type: string
          enum: [password, oidc, session, api_key, setup_token, cli, none]
        user_id:
          type: string
          format: uuid
          description: Absent once the account has been deleted.
        email:
          type: string
          description: Address of the account when the entry was written.
        display_name:
          type: string
          description: Display name of the account when the entry was written.
        api_key_id:
          type: string
          format: uuid

    AuditResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          examples: [user]
        id:
          type: string
          format: uuid

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [invalid_request]
            message:
              type: string
              description: Human-readable description without internal details.
            request_id:
              type: string
              description: Correlates the response with the server log.

  responses:
    Unauthenticated:
      description: The request carries no valid session.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the permission that the operation requires. The denial is recorded in the audit log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: The request changes state and comes from another origin than the console.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: The request body is malformed or a field is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The route does not exist or is not available to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: The request body exceeds the size limit of the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The request failed on the server. The response carries a generic message and a request ID that correlates it with the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A dependency, such as the database, is unreachable, or the server is too busy to answer in time. The `Retry-After` header suggests when to retry.
      headers:
        Retry-After:
          description: Seconds to wait before a retry.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
