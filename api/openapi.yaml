# SPDX-License-Identifier: AGPL-3.0-or-later

# This specification is the contract of the console HTTP interface. It is written
# by hand and kept in sync with the router by a test: every operation must exist in
# the router with the same method, path and access requirement, and vice versa.
#
# Every operation declares who may call it in x-access:
#   public         no authentication
#   authenticated  any signed-in user or API key, regardless of permissions
#   resource:action
#                  a principal that holds this permission
#
# The security requirements name the credentials an operation admits: the
# session cookie always, and an API key (bearerKey) only where a key can hold
# the access. A test compares them with the router and the scopes that keys may
# carry.

openapi: 3.1.0

info:
  title: Nyktus API
  summary: Console API of the Nyktus deception platform.
  description: |
    API routes live under `/api/v1`. Health endpoints for orchestrators live at the
    root.

    Every GET operation also answers HEAD with the same access requirement and
    without a body.

    Every error response uses the same envelope. Server errors carry a generic
    message and a request ID that correlates them with the server log.

    Browsers authenticate with a session cookie, which `POST /api/v1/session`
    sets, or, for users of an identity provider, the sign-in that
    `GET /api/v1/oidc/authorize` starts. Requests that change state and carry an `Origin` header must come from
    the origin of the console, otherwise they receive `403`.

    Integrations authenticate with an API key in the header
    `Authorization: Bearer <key>`. A request with a key authenticates with it
    alone; other credentials in the header are ignored. A key belongs to the team
    and holds its scopes, regardless of who created it. Operations that do not
    list `bearerKey` reject keys with `403`.
  version: 0.0.0
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later

servers:
  - url: /

tags:
  - name: health
    description: Liveness and readiness probes for orchestrators.
  - name: setup
    description: Creation of the first administrator of an installation.
  - name: session
    description: Sign-in, the session of the caller and sign-out.
  - name: api-keys
    description: API keys of the team, managed by administrators.
  - name: audit
    description: The audit log of security-relevant actions.
  - name: users
    description: Management of accounts by administrators, and their activation.

paths:
  /livez:
    get:
      operationId: getLiveness
      summary: Report that the process is running
      description: Checks no dependencies, so that an orchestrator does not restart the process while the database is down.
      tags: [health]
      x-access: public
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the console can serve requests
      tags: [health]
      x-access: public
      responses:
        "200":
          description: The console is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/setup:
    post:
      operationId: createFirstAdministrator
      summary: Create the first administrator
      description: |
        Creates the first administrator, active and with the given password. The
        request must carry a setup token. While no administrator exists, every
        console process issues one when it starts and prints a setup URL that
        contains the token in its fragment, such as
        `https://nyktus.example.com/setup#token=...`. A token is valid for one
        hour and can be used once.

        Once an administrator exists, the setup is closed for good, also after a
        restart. From then on, and for every request whose token is unknown,
        expired or already used, the operation answers with the same status,
        headers and body as a route that does not exist. Fields are validated only for a valid token.
      tags: [setup]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The administrator has been created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/session:
    post:
      operationId: signIn
      summary: Sign in with email address and password
      description: |
        Starts a session and sets the session cookie. A session cookie that the
        request already carries ends its session.

        For an account with a TOTP factor, the correct password does not start a
        session: the response is `202` with a challenge cookie, and
        `POST /api/v1/session/second-factor` completes the sign-in with a code.
        The count of failed sign-ins starts again only then.

        Every rejected sign-in receives the same `401`, whether the address is
        unknown, the password is wrong or the account may not sign in. That
        includes an account of the identity provider, which has no password, and,
        while users sign in through an identity provider, by default every
        account other than an administrator's. Five failed
        sign-ins in a row lock the account for 15 minutes. Only a request with the
        correct password learns that the account is locked, through `403` with the
        code `account_locked`.
      tags: [session]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. The response sets the session cookie.
          headers:
            Set-Cookie:
              description: The session cookie `__Host-nyktus_session`, with `Secure`, `HttpOnly`, `SameSite=Strict` and `Path=/`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "202":
          description: The password is correct, and the account has a second factor. The response sets the challenge cookie.
          headers:
            Set-Cookie:
              description: The challenge cookie `__Host-nyktus_challenge`, with `Secure`, `HttpOnly`, `SameSite=Strict` and `Path=/`. It is valid for five minutes.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecondFactorChallenge"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The email address or the password is wrong, or the account may not sign in.
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The password is correct, but the account is locked (`account_locked`), or the request comes from another origin.
          headers:
            Retry-After:
              description: Seconds until the lock ends. Only sent for a locked account.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    get:
      operationId: getSession
      summary: Return the session of the caller
      description: Returns the signed-in user and when the session ends. A request extends the session up to its maximum age.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The session of the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: signOut
      summary: Sign out
      description: Ends the session of the caller and clears the session cookie.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SessionRequired"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/session/password:
    put:
      operationId: changePassword
      summary: Change the password of the caller
      description: |
        Replaces the password of the signed-in user, who must give the current
        password. Every session of the account ends; the response sets a new
        session cookie in place of the one of the request, so the caller stays
        signed in. The count of failed sign-ins starts again, and an open
        password reset link of the account stops working.

        A wrong current password receives `403` with the code `wrong_password`
        and counts as a failed sign-in: five in a row lock the account for 15
        minutes. Only a request with the correct current password learns that the
        account is locked, through `403` with the code `account_locked`. Every
        attempt is recorded in the audit log as `user.password_change`.

        An account of the identity provider has no password and receives `409`
        with the code `oidc_account`.

        Only a session can change the password; an API key receives `403`.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is changed. The response sets the new session cookie.
          headers:
            Set-Cookie:
              description: The session cookie `__Host-nyktus_session`, with `Secure`, `HttpOnly`, `SameSite=Strict` and `Path=/`.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The current password is wrong (`wrong_password`), the current password is correct but
            the account is locked (`account_locked`), the request is not made with a session, or the
            request comes from another origin.
          headers:
            Retry-After:
              description: Seconds until the lock ends. Only sent for a locked account.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/oidc/authorize:
    get:
      operationId: beginOIDCSignIn
      summary: Start a sign-in through the identity provider
      description: |
        Sends the browser to the identity provider, which sends it back to
        `GET /api/v1/oidc/callback`. A browser navigates here; it is not called
        with `fetch`. The response sets a cookie that binds the sign-in to the
        browser. The sign-in must complete within ten minutes.

        Until the console has reached the identity provider, for example after
        a start while the provider was down, the response is `503`. Without a
        configured identity provider, it is `404`.
      tags: [session]
      x-access: public
      responses:
        "302":
          description: The browser goes to the identity provider.
          headers:
            Location:
              description: The authorization endpoint of the provider, with state, nonce and PKCE challenge.
              schema:
                type: string
            Set-Cookie:
              description: The cookie `__Host-nyktus_oidc`, with `Secure`, `HttpOnly`, `SameSite=Lax` and `Path=/`, valid for ten minutes.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/oidc/callback:
    get:
      operationId: completeOIDCSignIn
      summary: Complete a sign-in through the identity provider
      description: |
        The identity provider sends the browser here with a code. The console
        exchanges the code, verifies the ID token and starts a session. The
        account is created at the first sign-in; its role follows the groups of
        the user at the provider with every sign-in.

        The browser always goes on to a page of the console: `/` when signed in,
        `/sign-in#error=oidc` otherwise. The reason of a failure is recorded only
        in the log and, for an identity that the provider vouched for, in the
        audit log. Without a configured identity provider, the response is `404`.
      tags: [session]
      x-access: public
      parameters:
        - name: state
          in: query
          schema:
            type: string
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider instead of `code` if the user declined or the provider refused.
          schema:
            type: string
      responses:
        "303":
          description: The browser goes on to the console.
          headers:
            Location:
              description: "`/` when signed in, `/sign-in#error=oidc` otherwise."
              schema:
                type: string
            Set-Cookie:
              description: The cleared cookie `__Host-nyktus_oidc` and, when signed in, the session cookie `__Host-nyktus_session`.
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/session/second-factor:
    post:
      operationId: completeSignIn
      summary: Complete a sign-in with the second factor
      description: |
        Completes a sign-in that the password started, with a code of the
        authenticator app or a recovery code, and starts a session. The challenge
        comes from the cookie that `POST /api/v1/session` set. Each recovery code
        works once. A code is accepted for 30 seconds before and after its own
        period, and only once.

        A wrong code receives `401` with the code `invalid_code` and counts as a
        failed sign-in; the challenge stays valid, so that the user can enter the
        code again. Five failures in a row, with the password or a code, lock the
        account for 15 minutes; the challenge then ends, and the response is
        `403` with the code `account_locked`. A missing, expired or used
        challenge receives `401` with the code `invalid_challenge`: the user
        signs in again. So does a challenge of an account whose password or
        second factor changed meanwhile.
      tags: [session]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorProof"
      responses:
        "200":
          description: Signed in. The response sets the session cookie and clears the challenge cookie.
          headers:
            Set-Cookie:
              description: The session cookie `__Host-nyktus_session` and the cleared challenge cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: The challenge is not valid (`invalid_challenge`), or the code is wrong (`invalid_code`).
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The account is locked (`account_locked`), or the request comes from another origin.
          headers:
            Retry-After:
              description: Seconds until the lock ends. Only sent for a locked account.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/session/totp:
    post:
      operationId: beginTOTPSetup
      summary: Start the setup of a TOTP factor
      description: |
        Creates a new TOTP secret for the account of the caller, who confirms
        the request with their password. The response contains the secret and
        the `otpauth` URI for an authenticator app; they are shown only once.
        The factor protects the sign-in only after
        `POST /api/v1/session/totp/confirmation`, which must follow within ten
        minutes. A new setup replaces one that was not confirmed.

        A wrong password receives `403` with the code `wrong_password` and
        counts as a failed sign-in. An account that already has a factor
        receives `409` with the code `totp_enabled`, and an account of the
        identity provider, whose second factor the provider manages, `409` with
        the code `oidc_account`. Only a session can manage the second factor.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordConfirmation"
      responses:
        "201":
          description: The unconfirmed factor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPSetup"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SecondFactorForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: removeTOTP
      summary: Remove the TOTP factor of the caller
      description: |
        Removes the TOTP factor and the recovery codes of the account of the
        caller, who confirms with their password and a code or a recovery code.
        Every session of the account ends; the response sets a new session
        cookie in place of the one of the request.

        A wrong password receives `403` with the code `wrong_password`, a wrong
        code `403` with the code `wrong_code`; both count as a failed sign-in.
        An account without a factor receives `409` with the code
        `totp_not_enabled`. A user who lost their authenticator and their
        recovery codes asks an administrator to remove the factor.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorConfirmation"
      responses:
        "204":
          description: The factor is removed. The response sets the new session cookie.
          headers:
            Set-Cookie:
              description: The session cookie `__Host-nyktus_session`.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SecondFactorForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/session/totp/confirmation:
    post:
      operationId: confirmTOTP
      summary: Confirm the TOTP factor with a first code
      description: |
        Confirms the factor that `POST /api/v1/session/totp` created with a code
        of the authenticator app. From then on, signing in takes a code. The
        response contains ten recovery codes, which are shown only once. Every
        other session of the account ends, because it began without the second
        factor; the response sets a new session cookie in place of the one of
        the request.

        A wrong code receives `403` with the code `wrong_code` and counts as a
        failed sign-in; a locked account cannot confirm (`403` with the code
        `account_locked`). Without a setup, or after ten minutes, the response
        is `409` with the code `no_totp_setup`.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPCode"
      responses:
        "200":
          description: The factor is enabled. The response sets the new session cookie.
          headers:
            Set-Cookie:
              description: The session cookie `__Host-nyktus_session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SecondFactorForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/session/totp/recovery-codes:
    post:
      operationId: replaceRecoveryCodes
      summary: Replace the recovery codes of the caller
      description: |
        Replaces the recovery codes of the account of the caller with ten new
        ones, which are shown only once. The caller confirms with their password
        and a code or a recovery code, as for removing the factor.
      tags: [session]
      x-access: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecondFactorConfirmation"
      responses:
        "200":
          description: The new recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/SecondFactorForbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/api-keys:
    get:
      operationId: listAPIKeys
      summary: List the API keys of the team
      description: |
        Returns the API keys of the team, the newest first, with the
        administrator who created each, without their secrets. Expired keys
        are listed until the next key is created. Only a session can manage
        API keys.
      tags: [api-keys]
      x-access: api_keys:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The API keys of the team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The caller lacks the permission, which is recorded in the audit log at most once per user,
            permission and minute, or the request is not made with a session, which is not recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAPIKey
      summary: Create an API key
      description: |
        Creates an API key of the team, which the administrator confirms with
        their password, because a key outlives the session. The key is shown
        only in this response; the server keeps only a hash of its secret.

        A key acts with its scopes alone, regardless of the administrator who
        created it, and stays valid when that account is changed or deleted.
        The scopes must be distinct permissions that API keys may carry;
        currently only `audit:read`. `expires_at` is required and at most three
        years away. The team has at most 50 keys that have not expired (`409`,
        code `too_many_api_keys`).

        A wrong password receives `403` with the code `wrong_password` and
        counts as a failed sign-in. New keys, wrong passwords and requests of a
        locked account are recorded in the audit log as `api_key.create`. Only
        a session can create API keys. An administrator of the identity
        provider has no password and cannot create keys yet (`409`, code
        `oidc_account`).
      tags: [api-keys]
      x-access: api_keys:write
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAPIKeyRequest"
      responses:
        "201":
          description: The new key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedAPIKey"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The caller lacks the permission, the password is wrong (`wrong_password`), the password
            is correct but the account is locked (`account_locked`), the request is not made with a
            session, or the request comes from another origin.
          headers:
            Retry-After:
              description: Seconds until the lock ends. Only sent for a locked account.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/api-keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeAPIKey
      summary: Revoke an API key
      description: |
        Revokes an API key of the team, for example after it leaked. It stops
        working with the next request. The revocation is recorded in the audit
        log as `api_key.revoke`. Only a session can revoke API keys.
      tags: [api-keys]
      x-access: api_keys:write
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The key has been revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The caller lacks the permission, which is recorded in the audit log at most once per user,
            permission and minute, the request is not made with a session, which is not recorded, or
            the request comes from another origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/audit-entries:
    get:
      operationId: listAuditEntries
      summary: List audit entries
      description: |
        Returns audit entries from the newest to the oldest, a page at a time. To
        read the next page, pass the `next_cursor` of a response as `cursor`.
        Entries recorded meanwhile do not shift the following pages.

        Entries are ordered by the time they were written, not by the time their
        transaction committed. An entry of a transaction that took long to
        commit can appear behind entries a reader has already passed. A client
        that polls for new entries should therefore read again from a few minutes
        before its newest entry. Entries with the same time are ordered by their
        identifier, which makes the order total, not chronological.

        Entries contain personal data, so reads are recorded in the audit log as
        `audit.read`, at most once per user and minute, and separately for
        each API key.
      tags: [audit]
      x-access: audit:read
      security:
        - sessionCookie: []
        - bearerKey: []
      parameters:
        - name: limit
          in: query
          description: Number of entries per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntryPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List accounts
      description: |
        Returns accounts from the newest to the oldest, a page at a time. To read
        the next page, pass the `next_cursor` of a response as `cursor`.

        Accounts contain personal data, so reads are recorded in the audit log as
        `users.read`, at most once per user and minute.
      tags: [users]
      x-access: users:read
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          description: Number of accounts per page.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: The `next_cursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: A page of accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createUser
      summary: Create an account
      description: |
        Creates a pending account without a password and returns an activation
        link for it. The link is shown only in this response: pass it on to the
        user, who sets their own password through it. It is valid for 72 hours
        and can be used once. Administrators never set or see the password of
        another user.
      tags: [users]
      x-access: users:write
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The account has been created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUser
      summary: Get an account
      description: |
        Returns one account. The read is recorded like a read of the list.
      tags: [users]
      x-access: users:read
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateUser
      summary: Change an account
      description: |
        Changes the display name, the role or the status of an account, or
        removes its TOTP factor. Members that are left out stay unchanged. All
        changes take effect together or not at all.

        - A change of role or status ends every session of the account.
        - `status: deactivated` blocks the sign-in and removes an open activation
          link. `status: active` reactivates a deactivated account and ends a
          lock after failed sign-ins; an account that never set a password
          returns to `pending`, unless it signs in through the identity
          provider. A pending account becomes active only through its
          activation link.
        - The role of an account of the identity provider follows its groups
          there and cannot be changed (`409`, code `oidc_account`).
        - At least one active administrator must remain, and administrators
          cannot demote or deactivate their own account (`409`).
        - `totp_enabled: false` removes the TOTP factor and the recovery codes,
          for a user who lost both, and ends every session of the account. The
          administrator confirms it with their own `password`: a wrong one
          receives `403` with the code `wrong_password` and counts as a failed
          sign-in of the administrator; while their account is locked, only the
          correct password learns it (`403` with the code `account_locked`).
          The audit log records every attempt as `user.totp_disable`. Only a
          session can remove a factor (`403`). Administrators remove their own
          factor with `DELETE /api/v1/session/totp` (`409`). An administrator
          of the identity provider has no password and cannot remove factors
          yet (`409`, code `oidc_account`).

        The audit log records the names of the changed fields, not their values.
      tags: [users]
      x-access: users:write
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: The account after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The caller lacks the permission, the request comes from another origin, a second factor is
            removed with an API key (`forbidden`), the password of the administrator is wrong
            (`wrong_password`), or it is correct but their account is locked (`account_locked`).
          headers:
            Retry-After:
              description: Seconds until the lock ends. Only sent for a locked account.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      operationId: deleteUser
      summary: Delete an account
      description: |
        Deletes an account with its sessions and its activation link. Audit
        entries of the account remain readable. At least one active
        administrator must remain, and administrators cannot delete their own
        account (`409`).
      tags: [users]
      x-access: users:write
      security:
        - sessionCookie: []
      responses:
        "204":
          description: The account has been deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/users/{id}/activation-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createActivationLink
      summary: Create a new activation link
      description: |
        Returns a new activation link for a pending account, for example after
        the previous one expired. The previous link stops working. The link is
        shown only in this response.
      tags: [users]
      x-access: users:write
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new activation link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivationLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/users/{id}/password-reset-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createPasswordResetLink
      summary: Create a password reset link
      description: |
        Returns a password reset link for an active account, also a locked one,
        to pass on to its user. The previous link of the account stops working.
        The link is shown only in this response.

        Creating the link changes nothing else: the password and the sessions of
        the account stay valid until the link is used. An account of the
        identity provider has no password (`409`, code `oidc_account`).
      tags: [users]
      x-access: users:write
      security:
        - sessionCookie: []
      responses:
        "201":
          description: The new password reset link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ForbiddenWrite"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/activation:
    post:
      operationId: activateUser
      summary: Activate an account
      description: |
        Sets the password of a pending account and makes it active. The request
        must carry the token from the fragment of the activation link, such as
        `https://nyktus.example.com/activate#token=...`. The activation does not
        sign in.

        For every request whose token is unknown, expired or already used, the
        operation answers with the same status, headers and body as a route that
        does not exist. The password is validated only for a valid token.
      tags: [users]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivationRequest"
      responses:
        "200":
          description: The account is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/password-reset:
    post:
      operationId: resetPassword
      summary: Reset a password
      description: |
        Sets a new password for an active account. The request must carry the
        token from the fragment of the password reset link, such as
        `https://nyktus.example.com/reset-password#token=...`. Every session of
        the account ends, and so does a lock after failed sign-ins. The reset
        does not sign in.

        For every request whose token is unknown, expired, already used or
        issued as an activation link, the operation answers with the same
        status, headers and body as a route that does not exist. The password
        is validated only for a valid token.
      tags: [users]
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: The password is set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-nyktus_session
      description: Session token set by `POST /api/v1/session`.
    bearerKey:
      type: http
      scheme: bearer
      description: |
        API key created with `POST /api/v1/api-keys`, in the form
        `nyk_` followed by 84 characters of lowercase base32.

  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    SetupRequest:
      type: object
      additionalProperties: false
      required: [token, email, display_name, password]
      properties:
        token:
          type: string
          description: The setup token from the fragment of the setup URL.
        email:
          type: string
          format: email
          maxLength: 254
          description: Sign-in address. It is stored in lower case.
        display_name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name shown in the console and the audit log. Printable characters without leading or trailing spaces.
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFC normalization.

    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          description: Sign-in address, in any case.
        password:
          type: string
          format: password

    Session:
      type: object
      additionalProperties: false
      required: [user, idle_expires_at, expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        idle_expires_at:
          type: string
          format: date-time
          description: When the session ends unless it is used before.
        expires_at:
          type: string
          format: date-time
          description: When the session ends at the latest.

    User:
      type: object
      additionalProperties: false
      required: [id, email, display_name, role, status, totp_enabled, sign_in_method]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [admin, user, viewer]
        status:
          type: string
          enum: [pending, active, deactivated]
          description: A pending account has not set a password yet. A deactivated account cannot sign in.
        totp_enabled:
          type: boolean
          description: Whether signing in takes a code of a TOTP factor in addition to the password.
        sign_in_method:
          type: string
          enum: [password, oidc]
          description: |
            How the account signs in. An account of the identity provider (`oidc`) is created at its
            first sign-in, has no password and takes its role from its groups at the provider.

    AuditEntryPage:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        next_cursor:
          type: string
          description: Cursor of the next page. Absent on the last page.

    AuditEntry:
      type: object
      additionalProperties: false
      required: [id, occurred_at, action, outcome, actor, changed_fields]
      properties:
        id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        action:
          type: string
          description: What was done, in the form `resource.verb`, such as `session.create`. A denied request names the permission it lacked, such as `audit.read`.
          examples: [session.create]
        outcome:
          type: string
          enum: [success, failure, denied]
        actor:
          $ref: "#/components/schemas/AuditActor"
        resource:
          $ref: "#/components/schemas/AuditResource"
        changed_fields:
          type: array
          description: Names of the fields that an update changed, never their values.
          items:
            type: string
        client_ip:
          type: string
          description: Address of the client, if the action came from one.
        request_id:
          type: string
          description: Links the entry to the log records of its request.

    AuditActor:
      type: object
      additionalProperties: false
      required: [kind, auth_method]
      properties:
        kind:
          type: string
          enum: [user, api_key, setup, system, anonymous]
        auth_method:
          type: string
          enum: [password, oidc, session, api_key, setup_token, activation_token, password_reset_token, totp,
            recovery_code, cli, none]
        user_id:
          type: string
          format: uuid
          description: Absent once the account has been deleted.
        email:
          type: string
          description: Address of the account when the entry was written.
        display_name:
          type: string
          description: Display name of the account, or name of the API key, when the entry was written.
        api_key_id:
          type: string
          format: uuid
          description: The API key that acted, for the kind `api_key`.

    AuditResource:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          type: string
          examples: [user]
        id:
          type: string
          format: uuid

    UserPage:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        next_cursor:
          type: string
          description: Cursor of the next page. Absent on the last page.

    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, display_name, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The sign-in name of the account. It cannot be changed later.
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, viewer]

    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, user, viewer]
        status:
          type: string
          enum: [active, deactivated]
        totp_enabled:
          type: boolean
          const: false
          description: Removes the TOTP factor. A factor is enabled only by its user.
        password:
          type: string
          writeOnly: true
          description: The password of the administrator. Required with `totp_enabled`, and only with it.

    CreatedUser:
      type: object
      additionalProperties: false
      required: [user, activation]
      properties:
        user:
          $ref: "#/components/schemas/User"
        activation:
          $ref: "#/components/schemas/ActivationLink"

    ActivationLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: The activation link. It is shown only once.
        expires_at:
          type: string
          format: date-time

    ActivationRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The token from the fragment of the activation link.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFC normalization.

    PasswordResetLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url:
          type: string
          format: uri
          description: The password reset link. It is shown only once.
        expires_at:
          type: string
          format: date-time

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The token from the fragment of the password reset link.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFC normalization.

    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 12
          maxLength: 128
          description: Counted in Unicode code points after NFC normalization.

    SecondFactorChallenge:
      type: object
      additionalProperties: false
      required: [second_factor, expires_at]
      properties:
        second_factor:
          type: string
          enum: [totp]
        expires_at:
          type: string
          format: date-time
          description: When the challenge ends. The user then signs in again.

    SecondFactorProof:
      type: object
      additionalProperties: false
      description: Exactly one of `code` and `recovery_code`.
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: The current code of the authenticator app.
        recovery_code:
          type: string
          description: A recovery code, such as `abcd-efgh-ijkl-mnop`. Case, hyphens and spaces do not matter.

    SecondFactorConfirmation:
      type: object
      additionalProperties: false
      required: [password]
      description: The password and exactly one of `code` and `recovery_code`.
      properties:
        password:
          type: string
        code:
          type: string
          pattern: "^[0-9]{6}$"
        recovery_code:
          type: string

    APIKey:
      type: object
      additionalProperties: false
      required: [id, name, created_by, scopes, created_at, expires_at, last_used_at]
      properties:
        id:
          type: string
          format: uuid
          description: The identifier of the key. It is part of the key and not secret.
        name:
          type: string
        created_by:
          description: The administrator who created the key, or null if the account was deleted since.
          type: [string, "null"]
          format: uuid
        scopes:
          type: array
          items:
            type: string
            pattern: "^[a-z][a-z_]*:[a-z][a-z_]*$"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          description: When the key was last used, exact to a minute, or null if it was never used.
          type: [string, "null"]
          format: date-time

    APIKeyList:
      type: object
      additionalProperties: false
      required: [api_keys]
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"

    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes, expires_at, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: A name that tells the user what the key is for.
        scopes:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            enum: [audit:read]
        expires_at:
          type: string
          format: date-time
          description: When the key expires, in the future and at most three years away.
        password:
          type: string
          description: The password of the administrator.

    CreatedAPIKey:
      type: object
      additionalProperties: false
      required: [id, name, created_by, scopes, created_at, expires_at, last_used_at, key]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_by:
          description: The administrator who created the key, or null if the account was deleted since.
          type: [string, "null"]
          format: uuid
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: "null"
        key:
          type: string
          description: The API key. It is shown only once.

    PasswordConfirmation:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string

    TOTPCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"

    TOTPSetup:
      type: object
      additionalProperties: false
      required: [secret, uri, expires_at]
      properties:
        secret:
          type: string
          description: The secret in base32, for typing it into an authenticator app.
        uri:
          type: string
          description: The `otpauth://totp/` URI of the factor, usually shown as a QR code. It contains the secret.
        expires_at:
          type: string
          format: date-time
          description: The factor must be confirmed before this time.

    RecoveryCodes:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}-[a-z2-7]{4}$"

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              examples: [invalid_request]
            message:
              type: string
              description: Human-readable description without internal details.
            request_id:
              type: string
              description: Correlates the response with the server log.

  responses:
    Unauthenticated:
      description: The request carries no valid session or API key.
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SecondFactorForbidden:
      description: |
        The password is wrong (`wrong_password`), the code is wrong (`wrong_code`), the password is
        correct but the account is locked (`account_locked`), the request is not made with a session
        (`forbidden`), or the request comes from another origin.
      headers:
        Retry-After:
          description: Seconds until the lock ends. Only sent for a locked account.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    SessionRequired:
      description: The request is not made with a session, or it changes state and comes from another origin than the console.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller lacks the permission that the operation requires. The denial is recorded in the audit log, at most once per user, permission and minute, and separately for each API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenWrite:
      description: The caller lacks the permission that the operation requires, or the request comes from another origin than the console. A denial for a missing permission is recorded in the audit log, at most once per user, permission and minute, and separately for each API key.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: The request changes state and comes from another origin than the console.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: The request body is malformed or a field is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The route does not exist or is not available to the caller.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        The request conflicts with the state of the accounts. The error code names the conflict:
        `email_taken` (another account uses the address), `last_active_admin` (no active
        administrator would remain), `own_account` (administrators cannot demote, deactivate or
        delete their own account, or remove their own second factor through it), `invalid_state`
        (the account cannot take the requested status or receive the requested link: an activation
        link only for a pending account, a password reset link only for an active one),
        `totp_enabled` (the account already has a TOTP factor), `totp_not_enabled` (it has none),
        `no_totp_setup` (no setup of a TOTP factor waits for confirmation, or it expired),
        `too_many_api_keys` (the team has the maximum number of API keys that have not expired) or
        `oidc_account` (the account signs in through the identity provider, which manages its
        password, second factor and role).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: The request body exceeds the size limit of the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The request body is not application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: The request failed on the server. The response carries a generic message and a request ID that correlates it with the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A dependency, such as the database, is unreachable, or the server is too busy to answer in time. The `Retry-After` header suggests when to retry.
      headers:
        Retry-After:
          description: Seconds to wait before a retry.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
