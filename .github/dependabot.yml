version: 2
updates:
  # The cooldown delays updates until a release is a week old. Compromised releases
  # are usually discovered and withdrawn within days.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      go-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /sensor
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      sensor-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]

  # The packages of the web console. The build tools never ship, but the
  # runtime does, so the cooldown applies to both.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      web-dependencies:
        update-types: [minor, patch]
